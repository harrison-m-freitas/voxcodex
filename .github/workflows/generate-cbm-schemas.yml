name: Generate CBM Schemas

on:
  push:
    branches:
      - m2-plan04-materialization-validation
    paths:
      - 'src/voxcodex/domain/cbm/**'
      - 'scripts/generate_cbm_schemas.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-plan04-materialization-validation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install 'uv==0.12.13'
      - name: Sync
        run: uv sync --frozen
      - name: Generate schemas
        run: uv run python scripts/generate_cbm_schemas.py
      - name: Commit generated schemas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/cbm/0.1
          if git diff --cached --quiet; then
            echo 'Schemas already current.'
          else
            git commit -m 'build: snapshot cbm v0.1 json schemas'
            git push origin HEAD:m2-plan04-materialization-validation
          fi
