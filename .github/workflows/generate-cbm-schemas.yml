name: Generate CBM Schema Snapshots

on:
  push:
    branches:
      - m2-plan04-cbm-materialization

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install 'uv==0.12.13'
      - name: Sync
        run: uv sync --frozen
      - name: Generate schemas
        run: uv run python -m voxcodex.domain.cbm.schema_snapshots schemas/cbm/0.1
      - name: Commit generated schemas
        run: |
          if git diff --quiet -- schemas/cbm/0.1 && [ -d schemas/cbm/0.1 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/cbm/0.1
          git commit -m "chore: generate cbm v0.1 json schemas"
          git push
