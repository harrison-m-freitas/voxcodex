name: M2 Lock Refresh

on:
  push:
    branches:
      - m2-plan02-source-evidence
    paths:
      - pyproject.toml
      - .github/workflows/m2-lock-refresh.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-plan02-source-evidence
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install 'uv==0.12.13'
      - name: Refresh lock
        run: uv lock
      - name: Commit lock when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lock for plan02 dependencies"
          git push origin HEAD:m2-plan02-source-evidence
