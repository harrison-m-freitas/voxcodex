name: M2 Implementation CI

on:
  push:
    branches:
      - m2-plan02-source-evidence
      - m2-plan03-reconstruction
      - m2-plan04-cbm-materialization
      - m2-plan05-reprocessing-provenance
      - m2-plan06-corpus-candidate-freeze
  pull_request:
    branches:
      - main
      - m2-plan02-source-evidence

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install 'uv==0.12.13'
      - name: Sync
        run: uv sync --frozen
      - name: Run Plan 01 gate
        env:
          VOXCODEX_DATABASE_URL: sqlite:////tmp/voxcodex-plan01.db
        run: |
          uv run alembic upgrade head
          uv run pytest tests/unit tests/integration/storage tests/integration/corpus -v
          uv run voxcodex corpus status --registry corpus/COMPATIBILITY-CORPUS-V1.json
      - name: Run M2 Evidence implementation gate
        run: |
          uv run pytest tests/unit/domain/test_evidence_contracts.py tests/unit/adapters tests/integration/adapters tests/regression/test_evidence_known_slices.py -v
      - name: Run M2 Evidence CLI integration
        run: |
          uv run pytest tests/integration/cli -v
      - name: Run M2 quarantine regression
        run: |
          uv run pytest tests/unit/corpus/test_quarantine.py tests/integration/corpus -v
      - name: Run M2 Reconstruction implementation tests
        run: |
          uv run pytest \
            tests/unit/domain/test_reconstruction_contracts.py \
            tests/unit/reconstruction \
            tests/integration/reconstruction \
            tests/regression/test_cross_page_reconstruction.py \
            tests/regression/test_structured_reconstruction.py \
            -v
      - name: Run M2 Reconstruction plan gate
        run: |
          uv run pytest tests/unit/reconstruction tests/integration/reconstruction tests/regression -v
      - name: Re-run quarantine after Reconstruction gate
        run: |
          uv run pytest tests/unit/corpus/test_quarantine.py tests/integration/corpus -v
      - name: Run M2 CBM contracts when present
        run: |
          if [ -d tests/unit/cbm ]; then
            uv run pytest tests/unit/cbm -v
          fi
      - name: Run M2 Materialization and validation tests when present
        run: |
          paths=()
          [ -d tests/unit/materialization ] && paths+=(tests/unit/materialization)
          [ -d tests/unit/validation ] && paths+=(tests/unit/validation)
          [ -d tests/integration/materialization ] && paths+=(tests/integration/materialization)
          if [ ${#paths[@]} -gt 0 ]; then
            uv run pytest "${paths[@]}" -v
          fi
      - name: Run M2 Canonical implementation gate
        run: |
          uv run pytest tests/unit/cbm tests/unit/materialization tests/unit/validation tests/integration/materialization tests/regression/test_materialization_known_cases.py -v
      - name: Verify canonical trace for six object kinds
        run: |
          uv run pytest tests/integration/cli/test_trace_cli.py -v
      - name: Re-run quarantine after Canonical gate
        run: |
          uv run pytest tests/unit/corpus/test_quarantine.py tests/integration/corpus -v
      - name: Run M2 Execution tests when present
        run: |
          paths=()
          [ -d tests/unit/execution ] && paths+=(tests/unit/execution)
          [ -d tests/integration/execution ] && paths+=(tests/integration/execution)
          if [ ${#paths[@]} -gt 0 ]; then
            uv run pytest "${paths[@]}" -v
          fi
      - name: Run M2 Corpus and candidate-freeze tests when present
        run: |
          paths=()
          [ -f tests/unit/corpus/test_assertions.py ] && paths+=(tests/unit/corpus/test_assertions.py)
          [ -f tests/regression/test_frozen_assertions.py ] && paths+=(tests/regression/test_frozen_assertions.py)
          [ -f tests/unit/corpus/test_runner.py ] && paths+=(tests/unit/corpus/test_runner.py)
          [ -d tests/corpus ] && paths+=(tests/corpus)
          [ -f tests/unit/corpus/test_candidate.py ] && paths+=(tests/unit/corpus/test_candidate.py)
          [ -f tests/unit/corpus/test_holdout_reveal.py ] && paths+=(tests/unit/corpus/test_holdout_reveal.py)
          if [ ${#paths[@]} -gt 0 ]; then
            uv run pytest "${paths[@]}" -v
          fi
      - name: Generate M2 implementation candidate when prefreeze report exists
        run: |
          if [ -f planning/M2-PREFREEZE-REGRESSION-REPORT.json ]; then
            uv run voxcodex candidate freeze \
              --repo-root . \
              --regression-report planning/M2-PREFREEZE-REGRESSION-REPORT.json \
              --git-commit-sha "$GITHUB_SHA" \
              --output /tmp/M2-IMPLEMENTATION-CANDIDATE-V1.json
            python - <<'PY'
          import base64
          from pathlib import Path
          payload = Path('/tmp/M2-IMPLEMENTATION-CANDIDATE-V1.json').read_bytes()
          print('M2_CANDIDATE_B64=' + base64.b64encode(payload).decode('ascii'))
          PY
          fi
