[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voxcodex"
version = "0.1.0"
description = "VoxCodex document reconstruction and canonicalization foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.13,<2.14",
  "rfc8785==0.1.4",
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.20,<1.21",
  "typer>=0.27,<0.28",
]

[project.scripts]
voxcodex = "voxcodex.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1,<9.2",
  "hypothesis>=6.168",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/voxcodex"]
